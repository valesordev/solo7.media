name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: valesordev/ui/.github/workflows/astro-pages.yml@main
    with:
      # Hostname -> Faro app key. Kept in a repo variable, not here: the keys
      # ship to the browser and are not secrets, but they stay out of source.
      faro-apps: ${{ vars.FARO_APPS }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
