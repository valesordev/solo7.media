server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Required behind a TLS-terminating proxy. Left on, the trailing-slash
    # redirect for a directory (/about -> /about/) goes out as
    # "http://<host>:8080/about/", leaking the internal port, downgrading to
    # http, and dead-ending in a browser. Relative redirects keep the client's
    # own scheme, host and port. Every extensionless URL depends on this.
    absolute_redirect off;

    # Astro emits /about/index.html for /about, so a bare path must fall through
    # to the directory index and then to <path>.html before giving up.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro fingerprints everything under /_astro/, so it can be cached hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Kubernetes probes use this; it must not depend on the site's own routing.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
